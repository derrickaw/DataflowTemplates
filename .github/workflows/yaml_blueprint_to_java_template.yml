# This workflow generates or modifies Java template files based on changes
# to YAML files in a pull request.

name: YAML to Java Template Generation or Modification

on:
  pull_request:
    paths:
      - 'yaml/src/main/yaml/*.yaml'

jobs:
  generate-modifiy:
    name: Generate or Modify Java Templates
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Find changed YAML files
        id: changed-yaml-files
        run: |
          FILES=$(find yaml/src/main/yaml -name '*.yaml' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Generate Java Templates
        if: steps.changed-yaml-files.outputs.files
        run: |
          echo "Processing YAML files: ${{ steps.all-yaml-files.outputs.files }}"
          for file in ${{ steps.all-yaml-files.outputs.files }}; do
            python yaml/scripts/generate_yaml_java_interface.py "$file"
          done

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(templates): Autogenerate/modify Java templates from YAML"
          branch: ${{ github.head_ref }}



